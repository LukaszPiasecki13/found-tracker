repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (backend)
        entry: ruff check
        language: system
        files: ^backend/.*\.py$
        exclude: ^backend/alembic/
        pass_filenames: true
      - id: ruff-format
        name: ruff format (backend)
        entry: ruff format
        language: system
        files: ^backend/.*\.py$
        exclude: ^backend/alembic/
        pass_filenames: true
      - id: eslint-frontend
        name: eslint (frontend)
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: typecheck-frontend
        name: tsc -b (frontend)
        entry: bash
        args: [-c, "cd frontend && npm exec tsc -- -b"]
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false

  # Knowledge-base validator (R-13). Local hook pointing to ai-tools.
  - repo: local
    hooks:
      - id: kb-validate
        name: knowledge-base validator
        entry: python .claude/skills/knowledge-base/scripts/kb_validate.py
        language: system
        args: [--root, ., --strict]
        always_run: true
        pass_filenames: false
