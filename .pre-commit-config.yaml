repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (backend)
        entry: ruff check
        language: system
        files: ^backend/
        exclude: ^backend/alembic/
        pass_filenames: true
      - id: ruff-format
        name: ruff format (backend)
        entry: ruff format
        language: system
        files: ^backend/
        exclude: ^backend/alembic/
        pass_filenames: true
      - id: eslint-frontend
        name: eslint (frontend)
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: typecheck-frontend
        name: tsc -b (frontend)
        entry: npm --prefix frontend exec tsc -- -b
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false

  # Knowledge-base validator (R-13). `rev` is the ai-tools commit this was set up
  # against; bump it with `pre-commit autoupdate` once that commit is pushed.
  - repo: https://github.com/lukaszpiasecki13/ai-tools
    rev: 9684984
    hooks:
      - id: kb-validate
        args: [--root, ., --strict]
