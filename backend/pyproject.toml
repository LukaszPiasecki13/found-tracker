[tool.ruff]
line-length = 88
target-version = "py314"
indent-width = 4
exclude = [
    ".venv",
    "venv",
    "__pycache__",
    ".ruff_cache",
    ".pytest_cache",
    ".mypy_cache",
    ".git",
    "alembic",

]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes (includes unused imports)
    "W",    # pycodestyle warnings
    "I",    # isort (import sorting)
    "N",    # pep8-naming (naming conventions)
    "UP",   # pyupgrade (f-strings and modern Python syntax)
    "SIM",  # flake8-simplify (code simplification)
    "RET",  # flake8-return (return statement improvements)
    "RSE",  # flake8-raise (exception raising)
    "RUF",  # Ruff-specific rules
    "B",    # flake8-bugbear (common mistakes)
    "ISC",  # flake8-implicit-str-concat (warns about implicit string concatenation)
    "Q",    # flake8-quotes (quote consistency)
]
ignore = [
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# conftest.py sets DATABASE_URL (and aborts on a non-test database) before any
# `app.*` import, because Settings reads the environment at import time.
"conftest.py" = ["E402"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
[tool.mypy]
python_version = "3.14"
cache_dir = ".mypy_cache"
incremental = true
explicit_package_bases = true
strict = true
exclude = ["alembic/", "seed/"]

[[tool.mypy.overrides]]
module = [
    "*.tests.*",
    "*.conftest",
    "app.conftest",
    "sqlalchemy.*",
    "alembic.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["jose", "jose.*", "yfinance", "yfinance.*", "pandas", "pandas.*"]
ignore_missing_imports = true

# FastAPI route handlers: response contract is `response_model=` on the decorator,
# so a missing return annotation isn't a defect (python-coding-standards). Everything
# below the router (services, repositories, helpers) stays fully annotated.
[[tool.mypy.overrides]]
module = ["app.modules.*.api.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["app"]
python_files = ["test_*.py"]
addopts = "--strict-markers"
markers = [
    "integration: needs a real database (deselect with '-m \"not integration\"')",
    "unit: runs without a database",
]
